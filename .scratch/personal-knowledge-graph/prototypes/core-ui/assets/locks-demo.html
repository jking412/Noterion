<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两种锁 · 演示文件</title><style>body{font:15px/1.9 "Segoe UI","Microsoft YaHei",sans-serif;color:#294260;max-width:680px;padding:30px;margin:auto}h1{font-size:25px}h2{font-size:18px;margin-top:28px}aside{padding:14px;background:#f1f5f9;color:#63758c;font-size:13px}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:12px;border-bottom:1px solid #dbe3ed}</style><aside>Noterion #1 固定演示文件 · 虚构学习摘记 · 本地只读预览，未连接对象存储。</aside><h1>两种“锁”的学习摘记</h1><table><tr><th>知识点</th><th>所属主题</th><th>演示身份</th></tr><tr><td>锁</td><td>MySQL</td><td>mysql-lock</td></tr><tr><td>锁</td><td>并发编程</td><td>code-lock</td></tr></table><h2>数据库中的锁</h2><p>协调事务对数据的并发访问。排查锁等待时，关注持有与等待关系。</p><h2>并发编程中的锁</h2><p>保护共享状态和临界区。两条知识点名称相同，描述与身份分别保留。</p><aside>同一份文件可关联多个知识点；文件关联不会令同名知识点自动合并。</aside></html>
