[package]
name = "issue3-windows-smoke"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
