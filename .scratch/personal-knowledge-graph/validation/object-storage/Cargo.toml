[package]
name = "issue-10-object-storage-validation"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
anyhow = "1.0"
aws-sdk-s3 = { version = "=1.122.0", default-features = false, features = ["rt-tokio", "http-1x"] }
aws-smithy-http-client = { version = "=1.1.13", default-features = false, features = ["rustls-ring"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.dev]
debug = 0
incremental = false
